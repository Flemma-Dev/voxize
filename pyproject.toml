[project]
name = "voxize"
version = "0.3.2"
description = "Voice-to-text tool for Linux (Wayland/GNOME)"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.46",
    "sounddevice>=0.4",
    "websockets>=13.0",
    "openai>=1.0",
    "textual>=8.2,<9",
]

[project.scripts]
voxize = "voxize.gui.__main__:main"
voxize-tui = "voxize.tui.__main__:main"
voxize-meet = "voxize.meeting.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "black>=25.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxize"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # line length — enforced by Black
]

[tool.ruff.lint.isort]
known-first-party = ["voxize"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Nothing here uses anyio; its pytest plugin emits a PytestRemovedIn10Warning.
addopts = "-p no:anyio"
# PyGObject warns on import of GLib (its override reads the deprecated
# unix_signal_add_full); nothing here can change that, so keep the run quiet.
filterwarnings = ["ignore:GLib.unix_signal_add_full is deprecated:gi.PyGIDeprecationWarning"]
